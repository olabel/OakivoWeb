    <style>
      body { 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
        background-color: #08090A; 
        color: #F7F8F8; 
        letter-spacing: -0.011em;
        -webkit-font-smoothing: antialiased; 
        -moz-osx-font-smoothing: grayscale;
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      .font-mono-tech { font-family: 'JetBrains Mono', monospace; }
      
      main { padding-top: 80px; } 

      /* Linear-Style Metallic & Glassmorphic Cards */
      .linear-card {
        background: linear-gradient(180deg, rgba(23, 24, 28, 0.7) 0%, rgba(17, 18, 21, 0.8) 100%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03), 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      }
      
      .linear-card-hover {
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .linear-card-hover:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.18);
        background: linear-gradient(180deg, rgba(28, 29, 34, 0.8) 0%, rgba(20, 21, 26, 0.9) 100%);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      }

      .linear-nav {
        background: rgba(8, 9, 10, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .text-linear-heading {
        background: linear-gradient(180deg, #FFFFFF 0%, rgba(255, 255, 255, 0.65) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .text-linear-accent {
        background: linear-gradient(135deg, #707EED 0%, #00F0FF 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Linear Badge & KBD Pill */
      .linear-pill {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      }

      .kbd-pill {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 10px;
        font-family: 'JetBrains Mono', monospace;
        color: rgba(255, 255, 255, 0.7);
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
