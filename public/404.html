<!DOCTYPE html>

  <script>
    // Single Page App Deep-Link Redirect for Vercel Static Fallbacks
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      // If user hit a client-side route directly, redirect to index with path state
      if (path && path !== '/404' && path !== '/404.html') {
        sessionStorage.setItem('spa_redirect', path + search + hash);
        window.location.replace('/' + search + hash);
      }
    })();
  </script>
